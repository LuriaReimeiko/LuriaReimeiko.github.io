</style></head> <body>  <span class="message" data-value="Nothing here yet...">Nothing here yet...</span> <script type="module">const f="ABCDEFGHIJKLMNOPQRSTUVWXYZ";let c;const a=document.querySelector(".message");if(!a)throw new Error("Message element not found");const m=a.innerText;a.addEventListener("mouseenter",()=>{clearInterval(c),c=setInterval(()=>{a.innerText=m.split("").map(t=>t===" "?" ":f[Math.floor(Math.random()*f.length)]).join("")},50)});a.addEventListener("mouseleave",()=>{let t=0;clearInterval(c),c=setInterval(()=>{a.innerText=m.split("").map((o,n)=>n<t?m[n]:f[Math.floor(Math.random()*f.length)]).join(""),t>=m.length&&clearInterval(c),t+=1/3},30)});const e=document.createElement("canvas");e.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none";document.body.prepend(e);const s=e.getContext("2d"),h=36,H=2,w=220,A=w*w,C=.2;let S=-9999,T=-9999;window.addEventListener("mousemove",t=>{S=t.clientX,T=t.clientY});let d=[];function L(t,o){d=[];const n=Math.ceil(t/h)+2,l=Math.ceil(o/h)+2;for(let r=0;r<l;r++)for(let i=0;i<n;i++)d.push(i*h,r*h)}function y(){e.width=window.innerWidth,e.height=window.innerHeight,L(e.width,e.height)}y();window.addEventListener("resize",y);let E=0;const P=1e3/30;function F(t){if(!s)throw new Error("2D Context not found");if(requestAnimationFrame(F),!(t-E<P)){E=t,s.clearRect(0,0,e.width,e.height);for(let o=0;o<d.length;o+=2){const n=d[o],l=d[o+1],r=n-S,i=l-T,u=r*r+i*i;let v=n,p=l,g=1;if(u<A&&u>0){const M=Math.sqrt(u)/w,x=(1-M)*(1-M),I=x*C;v=n+r*I,p=l+i*I,g=1+x*1.2}const R=.18+(g-1)*.28;s.beginPath(),s.arc(v,p,H*Math.min(g,1.5),0,Math.PI*2),s.fillStyle=`rgba(255,255,255,${Math.min(R,.5)})`,s.fill()}}}requestAnimationFrame(F);</script>  </body></html>
